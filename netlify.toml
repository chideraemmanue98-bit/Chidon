[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  # The Firebase *web* API key is a public client identifier that is intentionally
  # embedded in the browser bundle (access is enforced by Firestore rules), so it is
  # excluded from secrets scanning. All other secrets stay server-side only.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
