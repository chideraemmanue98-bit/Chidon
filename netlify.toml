[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Rewrite all API paths to the serverless Express function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Fallback for SPA routing to handle routes on the client side
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
